<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Varta Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Join Screen -->
    <main id="loginBox" class="card login-card">
        <div class="brand">
            <span class="logo-icon">💬</span>
            <h2>Varta Chat</h2>
            <p>Simple, aesthetic realtime messaging</p>
        </div>
        <form id="joinForm" onsubmit="handleJoin(event)">
            <input id="nameInput" type="text" placeholder="Enter your display name" required autocomplete="off">
            <button type="submit" class="btn-primary">Join Room</button>
        </form>
    </main>

    <!-- Main Chat Room -->
    <main id="chatBox" class="card chat-card hidden">
        <header class="chat-header">
            <div class="room-info">
                <span id="statusDot" class="status-dot"></span>
                <div>
                    <h3>Varta Workspace</h3>
                    <span id="statusText" class="status-sub">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Message Feed -->
        <div id="messages" class="messages-area"></div>

        <!-- Chat Input Form -->
        <form id="chatForm" class="input-form" onsubmit="handleSend(event)">
            <input id="msgInput" type="text" placeholder="Type a message or @gemini..." autocomplete="off">
            <button type="submit" id="sendBtn" class="btn-send">Send</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
