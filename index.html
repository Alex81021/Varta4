<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varta Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginBox" class="card login-card">
        <div class="logo">💬</div>
        <h2>Varta Chat</h2>
        <p class="subtitle">Real-time room chat powered by Gemini</p>
        <div class="input-group">
            <input id="nameInput" placeholder="Enter your display name" onkeydown="if(event.key==='Enter') join()">
            <button onclick="join()">Join Room</button>
        </div>
    </div>

    <div id="chatBox" class="card chat-card hidden">
        <div class="chat-header">
            <div class="status-dot"></div>
            <h3>Varta Room</h3>
        </div>
        <div id="messages"></div>
        <div class="input-row">
            <input id="msgInput" placeholder="Message or @gemini..." onkeydown="if(event.key==='Enter') send()">
            <button onclick="send()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
