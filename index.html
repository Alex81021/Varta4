<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varta | Next-Gen Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div id="loginBox" class="glass-panel">
        <div class="logo">✨ Varta</div>
        <p class="subtitle">Enter the conversation</p>
        <div class="input-group">
            <input id="nameInput" type="text" placeholder="Choose a username..." onkeydown="if(event.key==='Enter') join()">
            <button onclick="join()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <div id="chatBox" class="glass-panel hidden">
        <div class="chat-header">
            <div class="logo small">✨ Varta</div>
            <div class="status">Live</div>
        </div>
        
        <div id="messages">
            </div>
        
        <div class="chat-input-area">
            <input id="msgInput" type="text" placeholder="Type a message or @gemini..." onkeydown="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
