<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varta Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-decor">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div id="loginBox" class="glass-card login-card">
        <div class="brand">
            <i class="fa-solid fa-bolt brand-icon"></i>
            <h2>Varta Chat</h2>
        </div>
        <p class="subtitle">Enter your handle to start chatting</p>
        <div class="input-group">
            <input id="nameInput" placeholder="Your display name..." autocomplete="off">
            <button onclick="join()">
                <span>Join Room</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="chatBox" class="glass-card chat-card hidden">
        <header class="chat-header">
            <div class="chat-title">
                <i class="fa-solid fa-comments"></i>
                <h3>Varta Room</h3>
            </div>
            <div id="userBadge" class="user-badge"></div>
        </header>

        <div class="chat-body">
            <div id="messages" class="messages-container"></div>
        </div>

        <footer class="chat-footer">
            <div class="input-container">
                <input id="msgInput" placeholder="Message room or @gemini..." onkeydown="if(event.key==='Enter') send()">
                <button onclick="send()" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
