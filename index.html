<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varta Workspaces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Join / Auth Modal -->
    <div id="loginBox" class="modal-overlay">
        <div class="card login-card">
            <div class="brand">
                <div class="brand-icon">💬</div>
                <h1>Welcome to Varta</h1>
                <p>Enter your display name to join the workspace</p>
            </div>
            <div class="form-group">
                <input id="nameInput" type="text" placeholder="e.g. Alex" maxlength="20" onkeydown="if(event.key==='Enter') join()">
                <button class="btn btn-primary" onclick="join()">Join Workspace</button>
            </div>
        </div>
    </div>

    <!-- Main Workspace App -->
    <div id="chatBox" class="app-layout hidden">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="workspace-icon">⚡</span>
                <span class="workspace-name">Varta Team</span>
            </div>
            
            <div class="sidebar-menu">
                <div class="menu-section">
                    <span class="section-title">CHANNELS</span>
                    <div class="channel-item active">
                        <span class="hashtag">#</span> general
                    </div>
                </div>

                <div class="menu-section">
                    <span class="section-title">INTEGRATIONS</span>
                    <div class="channel-item ai-item">
                        <span class="ai-badge">AI</span> @gemini
                    </div>
                </div>
            </div>

            <div class="user-profile-bar">
                <div id="myAvatar" class="avatar small">U</div>
                <div class="user-details">
                    <span id="myUsername" class="user-name">User</span>
                    <span class="user-status"><span class="status-dot"></span> Online</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Container -->
        <main class="chat-viewport">
            <header class="top-bar">
                <div class="channel-info">
                    <span class="hashtag">#</span>
                    <h2>general</h2>
                    <span class="divider"></span>
                    <span class="channel-topic">Official team chat room. Mention @gemini for AI answers.</span>
                </div>
            </header>

            <div id="messages" class="message-feed"></div>

            <div class="composer-container">
                <div class="input-bar">
                    <input id="msgInput" type="text" placeholder="Message #general (use @gemini for AI assistance)..." onkeydown="if(event.key==='Enter') send()">
                    <button class="send-btn" onclick="send()" title="Send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
